<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: #f4f6f9;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR STYLE --- */
        .sidebar {
            width: 260px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 30px;
            padding-left: 10px;
        }

        .brand i {
            color: #3b82f6;
        }

        .menu-list {
            list-style: none;
            flex-grow: 1;
        }

        .menu-item {
            margin-bottom: 8px;
        }

        .menu-item a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .menu-item a:hover, .menu-item.active a {
            background-color: #eff6ff;
            color: #3b82f6;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #cbd5e1;
        }

        .user-info .name {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }

        .user-info .role {
            font-size: 12px;
            color: #94a3b8;
        }

        /* --- MAIN CONTENT STYLE --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Top Header */
        .header {
            background-color: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-bar {
            position: relative;
            width: 300px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 15px 8px 35px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .search-bar i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }

        /* Dashboard Container */
        .dashboard-container {
            padding: 30px;
        }

        .page-title {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 25px;
        }

        /* Stats Cards grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-inner h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .card-inner p {
            font-size: 24px;
            font-weight: bold;
            color: #1e293b;
        }

        .card i {
            font-size: 28px;
            padding: 12px;
            border-radius: 10px;
        }

        .icon-blue { color: #3b82f6; background-color: #eff6ff; }
        .icon-green { color: #10b981; background-color: #ecfdf5; }
        .icon-orange { color: #f59e0b; background-color: #fffbeb; }
        .icon-red { color: #ef4444; background-color: #fef2f2; }

        /* Graphics/Layout Section (Map & Charts) */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .panel-box {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            min-height: 350px;
            display: flex;
            flex-direction: column;
        }

        .panel-box h3 {
            font-size: 16px;
            color: #1e293b;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Simulated Visual Elements (Map / Analytics) */
        .mock-map {
            flex-grow: 1;
            background: linear-gradient(45deg, #e2e8f0 25%, #f1f5f9 25%, #f1f5f9 50%, #e2e8f0 50%, #e2e8f0 75%, #f1f5f9 75%, #f1f5f9 100%);
            background-size: 40px 40px;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-weight: 500;
        }

        /* Little design accent to simulate tracking path like user's image */
        .mock-map::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 50%;
            border: 3px dashed #3b82f6;
            border-radius: 50%;
        }

        .mock-chart {
            flex-grow: 1;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding-top: 20px;
            background-color: #fafafa;
            border-radius: 8px;
        }

        .chart-bar {
            width: 30px;
            background: linear-gradient(to top, #3b82f6, #60a5fa);
            border-radius: 4px 4px 0 0;
            transition: height 0.5s ease;
            position: relative;
        }

        .chart-bar::after {
            content: attr(data-label);
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #64748b;
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand">
                <i class="fa-solid fa-bicycle"></i>
                <span>CityBike</span>
            </div>
            <ul class="menu-list">
                <li class="menu-item active">
                    <a href="#"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                </li>
                <li class="menu-item">
                    <a href="#"><i class="fa-solid fa-map-location-dot"></i> Live Tracking</a>
                </li>
                <li class="menu-item">
                    <a href="#"><i class="fa-solid fa-users"></i> Riders</a>
                </li>
                <li class="menu-item">
                    <a href="#"><i class="fa-solid fa-receipt"></i> Subscriptions</a>
                </li>
                <li class="menu-item">
                    <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
                </li>
            </ul>
        </div>

        <div class="user-profile">
            <img src="https://via.placeholder.com/40" alt="Admin">
            <div class="user-info">
                <p class="name">Rajib Das</p>
                <p class="role">Super Admin</p>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search anything...">
            </div>
            <div class="header-actions">
                <i class="fa-regular fa-bell"></i>
                <i class="fa-regular fa-envelope"></i>
                <i class="fa-solid fa-circle-user"></i>
            </div>
        </div>

        <div class="dashboard-container">
            <h2 class="page-title">Overview Dashboard</h2>

            <div class="stats-grid">
                <div class="card">
                    <div class="card-inner">
                        <h3>Total Bookings</h3>
                        <p>1,245</p>
                    </div>
                    <i class="fa-solid fa-route icon-blue"></i>
                </div>
                <div class="card">
                    <div class="card-inner">
                        <h3>Active Riders</h3>
                        <p>84</p>
                    </div>
                    <i class="fa-solid fa-user-check icon-green"></i>
                </div>
                <div class="card">
                    <div class="card-inner">
                        <h3>Total Earnings</h3>
                        <p>₹45,230</p>
                    </div>
                    <i class="fa-solid fa-wallet icon-orange"></i>
                </div>
                <div class="card">
                    <div class="card-inner">
                        <h3>Pending Issues</h3>
                        <p>3</p>
                    </div>
                    <i class="fa-solid fa-circle-exclamation icon-red"></i>
                </div>
            </div>

            <div class="content-grid">
                <div class="panel-box">
                    <h3>Live Ride Map <span style="font-size: 12px; color: #10b981;"><i class="fa-solid fa-circle"></i> Live Updating</span></h3>
                    <div class="mock-map">
                        <i class="fa-solid fa-location-crosshairs" style="font-size: 24px; color: #3b82f6; z-index: 1;"></i>
                        <span style="margin-left: 10px; z-index: 1;">Map View Interface</span>
                    </div>
                </div>

                <div class="panel-box">
                    <h3>Weekly Analytics</h3>
                    <div class="mock-chart">
                        <div class="chart-bar" style="height: 40%;" data-label="Mon"></div>
                        <div class="chart-bar" style="height: 65%;" data-label="Tue"></div>
                        <div class="chart-bar" style="height: 50%;" data-label="Wed"></div>
                        <div class="chart-bar" style="height: 85%;" data-label="Thu"></div>
                        <div class="chart-bar" style="height: 70%;" data-label="Fri"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
